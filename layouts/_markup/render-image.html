{{- $src := .Destination }}
{{- $w := 0 }}{{ $h := 0 }}
{{- with .Page.Resources.Get .Destination }}
  {{- $img := . }}
  {{- if gt .Width 1200 }}{{ $img = .Resize "1200x" }}{{ end }}
  {{- $src = $img.RelPermalink }}{{ $w = $img.Width }}{{ $h = $img.Height }}
{{- end }}
<a class="shot" href="{{ $src }}"><img src="{{ $src }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $w }} width="{{ $w }}" height="{{ $h }}"{{ end }} loading="lazy" decoding="async"></a>
{{- /**/ -}}
