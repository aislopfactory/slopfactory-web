<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16222e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Clawback</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c131a; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { touch-action: none; display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
      noscript { color: #fff; font: 16px sans-serif; position: fixed; inset: 0; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Clawback game"></canvas>
    <noscript>Clawback needs JavaScript enabled.</noscript>
    <script src="game.js"></script>
  </body>
</html>
